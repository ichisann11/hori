<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Pong</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            background-color: #000;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game objects
        const ball = { x: 400, y: 200, radius: 10, dx: 5, dy: 5 };
        const paddleWidth = 10;
        const paddleHeight = 100;
        const player = { x: 20, y: 150, width: paddleWidth, height: paddleHeight, dy: 0 };
        const computer = { x: 770, y: 150, width: paddleWidth, height: paddleHeight };

        // Player controls
        let upPressed = false;
        let downPressed = false;

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp") upPressed = true;
            else if (e.key === "ArrowDown") downPressed = true;
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowUp") upPressed = false;
            else if (e.key === "ArrowDown") downPressed = false;
        });

        function update() {
            // Move player paddle
            if (upPressed && player.y > 0) {
                player.y -= 7;
            }
            if (downPressed && player.y < canvas.height - player.height) {
                player.y += 7;
            }

            // Move computer paddle (Simple AI)
            const computerSpeed = 0.08;
            computer.y += ((ball.y - (computer.y + computer.height / 2))) * computerSpeed;
            // Prevent computer paddle from going out of bounds
            computer.y = Math.max(0, Math.min(computer.y, canvas.height - computer.height));

            // Move ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball collision with top and bottom walls
            if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
                ball.dy *= -1;
            }

            // Determine which paddle is active based on ball position
            let activePaddle = (ball.x < canvas.width / 2) ? player : computer;

            // Ball collision with paddles
            if (ball.x - ball.radius < activePaddle.x + activePaddle.width &&
                ball.x + ball.radius > activePaddle.x &&
                ball.y + ball.radius > activePaddle.y &&
                ball.y - ball.radius < activePaddle.y + activePaddle.height) {
                
                // Reverse direction and slightly increase speed for difficulty
                ball.dx *= -1.05; 
            }

            // Score / Reset ball if it passes a paddle
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
                ball.dx = (ball.dx > 0 ? -5 : 5); // Serve to the player who just scored
            }
        }

        function draw() {
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw paddles
            ctx.fillStyle = "white";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(computer.x, computer.y, computer.width, computer.height);

            // Draw ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();

            // Draw center dashed line
            for (let i = 0; i < canvas.height; i += 30) {
                ctx.fillRect(canvas.width / 2 - 1, i, 2, 15);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start the game loop
        loop();
    </script>
</body>
</html>
